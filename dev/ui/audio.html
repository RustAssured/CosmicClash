<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio audition</title>
    <style>
      :root {
        --bg: #07080d;
        --panel: #10131c;
        --line: #232838;
        --ink: #d8def0;
        --dim: #7a839c;
        --hot: #ffb347;
        --cool: #6fd3ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          13px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        letter-spacing: 0.08em;
      }
      h2 {
        font-size: 11px;
        margin: 18px 0 6px;
        color: var(--dim);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 8px;
        color: var(--dim);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 12px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      select,
      input[type='range'] {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        font: inherit;
      }
      input[type='range'] {
        width: 140px;
        padding: 0;
        accent-color: var(--hot);
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--cool);
        outline: none;
      }
      button:active {
        background: #1b2030;
      }
      button.on {
        border-color: var(--hot);
        color: var(--hot);
      }
      #meter {
        width: 100%;
        height: 44px;
        display: block;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      #status {
        color: var(--hot);
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 12px;
        overflow: auto;
        max-height: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AUDIO AUDITION</h1>
      <p>
        Everything here is synthesised live by the real engine (<code>src/audio</code>). Click anywhere first:
        browsers keep the AudioContext suspended until a gesture. <span id="status">suspended</span>
      </p>
      <h2>Scene</h2>
      <div class="row">
        <label
          >Fighter A
          <select id="titanA"></select
        ></label>
        <label
          >Fighter B
          <select id="titanB"></select
        ></label>
        <label
          >Stage
          <select id="stage"></select
        ></label>
        <label
          >Phase
          <select id="phase"></select
        ></label>
        <label
          >Intensity <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.4" /><span
            id="intensityV"
            >0.40</span
          ></label
        >
        <label
          >Integrity <input id="integrity" type="range" min="0" max="1" step="0.01" value="0.9" /><span
            id="integrityV"
            >0.90</span
          ></label
        >
        <button id="score">Score: off</button>
      </div>
      <h2>Volume</h2>
      <div class="row">
        <label>Master <input id="vMaster" type="range" min="0" max="1" step="0.01" value="0.85" /></label>
        <label>Music <input id="vMusic" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
        <label>SFX <input id="vSfx" type="range" min="0" max="1" step="0.01" value="0.9" /></label>
      </div>
      <h2>Level (pre-limiter red, post-limiter cyan)</h2>
      <canvas id="meter" width="1100" height="44"></canvas>
      <div id="groups"></div>
      <h2>Numeric verification</h2>
      <div class="row">
        <button id="verify">Run OfflineAudioContext verification</button>
        <span id="verifyState"></span>
      </div>
      <pre id="report" hidden></pre>
    </main>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>

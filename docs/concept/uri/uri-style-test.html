<style>

</style></head><body><main>
<h1>우리, pixel-art treatment</h1>
<p>The same 3D model, rendered two ways, and then next to the Witness and the Planet in one frame.</p>
<div class="two">
<figure><canvas class="px" id="cvS" width="640" height="360" aria-label="우리 rendered with smooth 3D shading."></canvas><figcaption><b>Before:</b> smooth 3D lighting, dithered into the palette.</figcaption></figure>
<figure><canvas class="px" id="cvT" width="640" height="360" aria-label="우리 with the pixel-art treatment: banded light, a dark outline, crisp highlights."></canvas><figcaption><b>After:</b> light in a few hard steps per material, a 1-pixel outline, inner lines where parts overlap, crisp highlights, no smoothing.</figcaption></figure>
</div>
<section><figure><canvas class="px" id="cvX" width="640" height="360" aria-label="The Witness on the left and 우리 on the right in one frame at relative scale, with the Planet between them."></canvas><figcaption><b>Together, at game scale.</b> The Witness (drawn in 2D) and 우리 (3D with the pixel-art treatment) in one frame, with the Planet between them for scale.</figcaption></figure></section>
</main><script>
'use strict';
const W=640,H=360,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sst=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(h,a=1)=>{const c=typeof h==='string'?hex(h):h;return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h3(x,y,z){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function n3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const xf=x-xi,yf=y-yi,zf=z-zi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const a=lerp(lerp(h3(xi,yi,zi),h3(xi+1,yi,zi),u),lerp(h3(xi,yi+1,zi),h3(xi+1,yi+1,zi),u),v),b=lerp(lerp(h3(xi,yi,zi+1),h3(xi+1,yi,zi+1),u),lerp(h3(xi,yi+1,zi+1),h3(xi+1,yi+1,zi+1),u),v);return lerp(a,b,w);}
function fbm(x,y,z,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*n3(x*f,y*f,z*f);n+=a;a*=.5;f*=2.03;}return s/n;}

// ---------- palette and dither ----------
const PAL=['#000000','#03040a','#080a16','#0f1124','#171a33','#120a1c','#22122e','#33183f',
 '#16302e','#0c1513','#16261f','#22392f','#355647','#4f7d68','#7aa898','#b4d3c3',
 '#3b3428','#6e634c','#a89c7e','#d9cfb1','#f3eedb','#2a1e0c','#5c4216','#8f6b24','#c39b3e','#e9c96c','#fff1b8','#7fe8de','#e6fffb',
 '#0b1a3a','#13306a','#1d4c96','#2f74c0','#7fb4ff','#2e5a2a','#4f7f3a','#8a9a52','#b39a6a','#c7d4e8','#eef1f6','#060a18',
 '#0b0709','#1d1013','#351a1e','#57292c','#7f4440','#aa6a5e','#d5a28f','#f0d6c6','#2a0609','#5a1014','#8a1f1c','#b8ff3c','#ff3fd2','#6b2a8a','#ffffff','#141014','#241b20','#3a2c30','#564246','#7a6462','#a08c86','#c6b6ac','#e2d8cc','#07040a','#140a10','#24101a','#3a1424','#6b1a2a','#9a2a3c','#d0546a','#f0e2cc','#c8b49a','#8f7a64','#4e3e34','#9aa4b8','#dfe6f2','#ff5a8a','#b03aa0','#07090a','#0e1414','#172120','#24332f','#3b524a','#6f8f84','#1c1810','#3a3020','#5e4a2a','#0d0c0f','#1c1a1f','#2e2a2e','#47403d','#6b5f55','#93857a','#3a2c1c','#6a4e2a','#a07a3e','#d2ae68','#9ff3ff','#e8feff','#4fb8d8','#fff4d6','#ffd27a','#ff9a3c','#ffb347','#7fc8ff','#6fa8dc','#ffe9b0','#b84a2a','#2f3a2a','#4a5a3a','#dfe9f0','#a9c4d6','#1e1e23','#2c2c32','#3b3b42','#4d4c53','#626067','#7a777c','#95918f'].map(hex);
const LUT=new Uint8Array(32768);
(function(){for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){const R=r*8+4,G=g*8+4,B=b*8+4;let bi=0,bd=1e9;
  for(let i=0;i<PAL.length;i++){const p=PAL[i];const dr=R-p[0],dg=G-p[1],db=B-p[2];const d=dr*dr*.3+dg*dg*.59+db*db*.11;if(d<bd){bd=d;bi=i;}}LUT[(r<<10)|(g<<5)|b]=bi;}})();
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16-.5);
function quantize(img,spread=26){const d=img.data,w=img.width;for(let i=0,p=0;i<d.length;i+=4,p++){const x=p%w,y=(p/w)|0;const o=BAY[(y&3)*4+(x&3)]*spread;
  const r=clamp(d[i]+o,0,255)>>3,g=clamp(d[i+1]+o,0,255)>>3,b=clamp(d[i+2]+o,0,255)>>3;const c=PAL[LUT[(r<<10)|(g<<5)|b]];d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}}

// ---------- shared scenery ----------
const STARS=(()=>{const r=rng(7);const a=[];for(let i=0;i<260;i++)a.push({x:r()*W,y:r()*H,b:r(),ph:r()*TAU,c:r()});return a;})();
function space(g,t,tone){
  const top=tone==='rot'?'#0a0612':'#03040c',bot=tone==='rot'?'#140a1c':'#08101a';
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);
  const blobs=tone==='rot'?[[160,90,240,'#33183f',.55],[470,300,260,'#2a0609',.5],[520,60,180,'#22122e',.5],[90,320,200,'#120a1c',.6]]:[[150,120,260,'#16302e',.45],[500,290,240,'#171a33',.6],[560,70,200,'#2a1e0c',.35],[60,300,180,'#0f1124',.6]];
  for(const[x,y,r,c,a]of blobs){const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,rgba(c,a));rg.addColorStop(1,rgba(c,0));g.fillStyle=rg;g.fillRect(0,0,W,H);}
  for(const s of STARS){const tw=.5+.5*Math.sin(t*(.6+s.b)+s.ph);const a=(.25+.75*s.b)*tw;g.fillStyle=s.c<.15?rgba('#e9c96c',a):s.c<.3?rgba('#7fb4ff',a):rgba('#eef1f6',a);g.fillRect(s.x|0,s.y|0,1,1);if(s.b>.96){g.fillStyle=rgba('#eef1f6',a*.5);g.fillRect((s.x|0)-1,s.y|0,3,1);g.fillRect(s.x|0,(s.y|0)-1,1,3);}}
}
// the Planet, rendered per pixel
const planetCache={};
function planet(g,cx,cy,r,t){
  const key=r;let c=planetCache[key];if(!c){c=document.createElement('canvas');c.width=c.height=r*2+8;planetCache[key]=c;}
  const pg=c.getContext('2d');const img=pg.createImageData(c.width,c.height);const d=img.data;const o=r+4;const rot=t*.05,cr=Math.cos(rot),sr=Math.sin(rot);
  const L=[-.55,-.45,.7];const ll=Math.hypot(...L);L[0]/=ll;L[1]/=ll;L[2]/=ll;
  for(let y=-r-3;y<=r+3;y++)for(let x=-r-3;x<=r+3;x++){const i=((y+o)*c.width+(x+o))*4;const dd=Math.sqrt(x*x+y*y)/r;
    if(dd>1){if(dd<1.08){const a=(1-(dd-1)/.08);const lit=clamp(.4+(-x*L[0]-y*L[1])/r,0,1);d[i]=127;d[i+1]=180;d[i+2]=255;d[i+3]=a*a*160*lit;}continue;}
    const nx=x/r,ny=y/r,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));const X=nx*cr-nz*sr,Z=nx*sr+nz*cr,Y=ny;
    const h=fbm(X*1.7+3.1,Y*1.7,Z*1.7,4);const land=h>.53;const cl=fbm(X*2.6+9+t*.01,Y*3.2,Z*2.6,3);
    const dif=clamp(nx*L[0]+ny*L[1]+nz*L[2],0,1);let col;
    if(land){const e=clamp((h-.53)/.2,0,1);col=e<.3?[46,90,42]:e<.6?[79,127,58]:e<.85?[138,154,82]:[179,154,106];}
    else{const dp=clamp((.53-h)/.25,0,1);col=[lerp(47,11,dp),lerp(116,26,dp),lerp(192,58,dp)];}
    if(cl>.6){const k=clamp((cl-.6)/.12,0,1);col=[lerp(col[0],238,k),lerp(col[1],241,k),lerp(col[2],246,k)];}
    const sh=.08+.92*dif;const rim=Math.pow(1-nz,3)*.8*clamp(dif+.3,0,1);
    d[i]=clamp(col[0]*sh+127*rim,0,255);d[i+1]=clamp(col[1]*sh+180*rim,0,255);d[i+2]=clamp(col[2]*sh+255*rim+(1-dif)*8,0,255);d[i+3]=255;}
  pg.putImageData(img,0,0);g.drawImage(c,cx-o,cy-o);
}

// ================= THE WITNESS (v2: one body, made of countless structures) =================
const J=['#07090a','#0e1414','#172120','#24332f','#3b524a','#6f8f84','#a8bdb2'];const BZ=['#07090a','#1c1810','#3a3020','#5e4a2a','#8f6b24'];
const GOLD=['#2a1e0c','#5c4216','#8f6b24','#c39b3e','#e9c96c','#fff1b8'];
const ramp=(arr,v)=>arr[clamp(Math.round(clamp(v,0,1)*(arr.length-1)),0,arr.length-1)];
function carapace(R,wounded){
  const S=Math.round(R*1.45);const c=document.createElement('canvas');c.width=c.height=S*2+4;const g=c.getContext('2d');const img=g.createImageData(c.width,c.height);const d=img.data;const o=S+2;
  const cell=6;const edge=(ang)=>{const k=ang;return R*(1+.13*Math.sin(3*k+.7)+.09*Math.sin(5*k+2.1)+.07*Math.sin(9*k+.3)+(n3(Math.cos(k)*2+5,Math.sin(k)*2,1)-.5)*.35)*(1+(h3(Math.floor((k+Math.PI)*4),1,7)>.75?.16:0));};
  for(let y=-S;y<=S;y++)for(let x=-S;x<=S;x++){const ang=Math.atan2(y,x);const er=edge(ang);const dist=Math.sqrt(x*x+y*y);if(dist>er)continue;const i=((y+o)*c.width+x+o)*4;
    const dd=dist/er;const nz=Math.sqrt(Math.max(0,1-dd*dd*.92));const nx=x/er,ny=y/er;const dif=clamp(-.5*nx-.6*ny+.62*nz,0,1);
    const u=x/(.35+nz*.65)/cell,v=y/(.35+nz*.65)/cell;const cx0=Math.floor(u),cy0=Math.floor(v);let d1=9,d2=9,id=0,gx0=0,gy0=0;
    for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){const gx=cx0+k,gy=cy0+j;const px=gx+h3(gx,gy,1),py=gy+h3(gx,gy,2);const dist2=Math.hypot(u-px,v-py);if(dist2<d1){d2=d1;d1=dist2;id=h3(gx,gy,3);gx0=gx;gy0=gy;}else if(dist2<d2)d2=dist2;}
    // room between the cells grows toward the rim; some outer cells are simply missing
    const gap=.035+dd*dd*.1;const missing=dd>.78&&h3(gx0,gy0,6)<(dd-.78)*1.5;
    if(d2-d1<gap||missing){if(h3(x,y,13)>.993){d[i]=233;d[i+1]=201;d[i+2]=108;d[i+3]=255;}else if(dd<.8){d[i]=7;d[i+1]=9;d[i+2]=10;d[i+3]=255;}continue;}
    const goldy=id>.93||(dd>.55&&dd<.68&&id>.72);const lv=.2+dif*.62+(id-.5)*.22-(d2-d1<gap*1.6?.12:0);
    let col=hex(goldy?ramp(GOLD,lv+.05):(id>.55?ramp(BZ,lv):ramp(J,lv)));
    if(h3(x,y,9)>.988)col=wounded?[230,255,251]:(id>.5?[233,201,108]:[168,189,178]);
    if(wounded&&d2-d1<gap*1.8&&h3(gx0,gy0,5)>.45)col=[180,250,240];
    const lim=Math.pow(1-nz,2)*.35;col=[col[0]+50*lim,col[1]+60*lim,col[2]+55*lim];
    d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;}
  g.putImageData(img,0,0);c.off=o;return c;}
let CARA=null,CARA_W=null;
function cbez(P,t){const u=1-t;return[u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0],u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]];}
function armPts(P,wmax,t0,t1,N=40){const L=[],R=[],C=[];
  for(let k=0;k<=N;k++){const t=lerp(t0,t1,k/N);const p=cbez(P,t),q=cbez(P,Math.min(1,t+.01)),pp=cbez(P,Math.max(0,t-.01));let tx=q[0]-pp[0],ty=q[1]-pp[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const w=wmax*Math.pow(1-t,1.05)*(.85+.3*Math.sin(Math.PI*t*.8))+1;C.push([p[0],p[1],t,tx,ty,w]);L.push([p[0]-ty*w*.5,p[1]+tx*w*.5]);R.push([p[0]+ty*w*.5,p[1]-tx*w*.5]);}
  return{L,R,C};}
function poly(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));}
function orbEye(g,x,y,r,open,t){g.fillStyle='#03040a';g.beginPath();g.ellipse(x,y,r+2,r+1.2,0,0,TAU);g.fill();g.strokeStyle='#8f6b24';g.lineWidth=1;g.beginPath();g.ellipse(x,y,r+1.4,r+.8,0,0,TAU);g.stroke();
  const o=Math.max(.12,open);g.fillStyle='#a89c7e';g.beginPath();g.ellipse(x,y,r,r*o,0,0,TAU);g.fill();g.fillStyle='#355647';g.beginPath();g.ellipse(x+Math.sin(t*.7)*.5,y,r*.55,r*o*.95,0,0,TAU);g.fill();
  g.fillStyle='#010203';g.fillRect(Math.round(x+Math.sin(t*.7)*.5),Math.round(y-r*o*.7),1,Math.max(1,Math.round(r*o*1.4)));if(open>.6){g.fillStyle='#e6fffb';g.fillRect(Math.round(x-r*.4),Math.round(y-r*.4),1,1);}
  g.fillStyle='#0c1513';g.fillRect(Math.round(x-r),Math.round(y-r*o-1),Math.round(r*2),1);}
// an arm: one continuous mass built from countless accreted structures, dissolving at its edges
function chunk(g,x,y,sz,rot,lit,seed){const r=rng(seed);const n=5+(seed%3);const pts=[];for(let j=0;j<n;j++){const a=rot+j/n*TAU;const rr=sz*(.65+.45*r());pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr*.85]);}
  g.fillStyle=ramp(J,lit*.38);poly(g,pts);g.fill();
  g.fillStyle=ramp(J,lit*.46+.1);g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let j=1;j<n;j++){const p=pts[j];g.lineTo(lerp(p[0],x-sz*.3,.45),lerp(p[1],y-sz*.35,.45));}g.fill();
  if(lit>.6){g.strokeStyle=ramp(J,lit*.45+.45);g.lineWidth=1;g.beginPath();g.moveTo(pts[n-1][0],pts[n-1][1]);g.lineTo(pts[0][0],pts[0][1]);g.lineTo(pts[1][0],pts[1][1]);g.stroke();}}
function arm(g,P,w,t,o,seed){const t1=o.cut||1;const{L,R,C}=armPts(P,w,0,t1,72);const r=rng(seed);const lx=-.55,ly=-.83;
  // drifting fragments where the arm dissolves into space
  for(let k=4;k<C.length;k++){const[cx,cy,tt,tx,ty,ww]=C[k];const n=1+Math.floor(tt*4);for(let j=0;j<n;j++){const side=r()<.55?-1:1;const off=ww*.5+2+r()*(4+tt*20);const drift=((t*(2+r()*3)+r()*40)%40)*(.3+tt);
    const x=cx+(-ty)*side*off-tx*drift,y=cy+tx*side*off-ty*drift;g.fillStyle=r()<.07?(r()<.6?'#e9c96c':'#7fe8de'):(r()<.5?ramp(J,.15+r()*.3):ramp(BZ,.2+r()*.4));g.fillRect(Math.round(x),Math.round(y),r()<.2?2:1,1);}}
  // a dark, porous core: the arm is a structure with room inside, not a solid slab
  {const Li=[],Ri=[];for(let k=0;k<C.length;k++){const[cx,cy,tt,tx,ty,ww]=C[k];Li.push([cx-ty*ww*.46,cy+tx*ww*.46]);Ri.push([cx+ty*ww*.46,cy-tx*ww*.46]);}poly(g,[...Li,...Ri.reverse()]);g.fillStyle=rgba('#07090a',.82);g.fill();}
  // the cells: a lattice of bulbous structures with room between them, shaded round across the width
  for(let k=0;k<C.length;k++){const[cx,cy,tt,tx,ty,ww]=C[k];const nC=Math.max(1,Math.round(ww/5.2));const sp_=ww/nC;for(let j=0;j<nC;j++){if(r()<.07)continue;const q=((j+.5)/nC*2-1)+(r()-.5)*.12;const a=q*ww*.5;
    const along=(k%2?.5:0)*0+(r()-.5)*1.5;const x=cx+(-ty)*a+tx*along,y=cy+tx*a+ty*along;
    const facing=Math.sqrt(Math.max(0,1-q*q));const nd=q*((-ty)*lx+tx*ly);const lit=clamp(.04+.5*Math.pow(facing,1.3)+.5*Math.max(0,nd)*facing,0,1);
    const sz=Math.max(.9,Math.min(3.4,sp_*.46)*(.8+.35*r())*(.7+.3*facing));const bronze=n3(k*.12,j*.5,seed)>.58;const glow=r()<.025;
    g.fillStyle=glow?(r()<.6?'#e9c96c':'#7fe8de'):(bronze?ramp(BZ,lit*.95):ramp(J,lit*.85));g.beginPath();g.ellipse(x,y,sz,sz*.85,Math.atan2(ty,tx),0,TAU);g.fill();
    if(!glow&&lit>.32){g.fillStyle=bronze?ramp(GOLD,lit*.85):ramp(J,lit*.85+.2);g.fillRect(Math.round(x+lx*sz*.45),Math.round(y+ly*sz*.45),1,1);}
    if(sz>2.2){g.fillStyle='#07090a';g.fillRect(Math.round(x-lx*sz*.6),Math.round(y-ly*sz*.6),1,1);}}}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="ADEUK: TITANS — colossal cosmic entities physically wear each other down. A 2.5D pixel-art fighting game."
    />
    <title>ADEUK: TITANS · 아득</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060a'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23a8bdb2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas#game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game" width="640" height="360" tabindex="0"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
